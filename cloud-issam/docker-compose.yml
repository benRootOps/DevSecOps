version: "3.8"
services:
  frontend:
    build: ./frontend
    networks:
      - appnet

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_NAME: cloud_issam
      DB_USER: root
      DB_PASSWORD: root
      DB_HOST: database
      DB_PORT: 3306
    depends_on:
      - database
    volumes:
      - ./backend:/app
    networks:
      - appnet

  siem-ssh:
    build:
      context: .
      dockerfile: siem/Dockerfile
    mem_limit: 256m
    mem_reservation: 64m
    privileged: true
    network_mode: host
    volumes:
      - ./siem/var:/app/var
      - ./siem/etc:/app/etc:ro
      - ./logs/auth:/logs/auth:ro
    command: python3 /app/bin/siem.py --config /app/etc/config_ssh.yaml

  siem-web:
    build:
      context: .
      dockerfile: siem/Dockerfile
    mem_limit: 512m
    mem_reservation: 128m
    privileged: true
    network_mode: host
    volumes:
      - ./siem/var:/app/var
      - ./siem/etc:/app/etc:ro
      - ./logs/openresty:/logs/openresty:ro
    command: python3 /app/bin/siem.py --config /app/etc/config_web.yaml

  database:
    image: mariadb:10
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cloud_issam
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - appnet

  openresty:
    image: openresty/openresty:latest
    command: nginx -g "daemon off;" -c /etc/nginx.conf
    ports:
      - "0.0.0.0:8080:80"
    volumes:
      - ./openresty/nginx.conf:/etc/nginx.conf
      - ./openresty/conf.d/default.conf:/etc/nginx/conf.d/default.conf
      - ./logs/openresty:/var/log/nginx
    depends_on:
      - frontend
      - backend
      - siem-ssh
      - siem-web
    networks:
      - appnet

networks:
  appnet:

volumes:
  mariadb_data:
    external: true
