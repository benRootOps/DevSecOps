repos:
  # 1. SCAN DES SECRETS - BLOQUE TOUT DE SUITE
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
        name: Gitleaks Secret Scan
        args: ["detect", "--source=.", "--verbose"]
        stages: [pre-push] # Ne scan que au push pour aller plus vite

  # 2. LARAVEL / PHP
  - repo: https://github.com/pre-commit/mirrors-php-cs-fixer
    rev: v3.40.0
    hooks:
      - id: php-cs-fixer
        name: PHP CS Fixer - Laravel Style
        args: [--config=.php-cs-fixer.php]
        files: ^api/

  - repo: local
    hooks:
      - id: composer-audit
        name: Composer Security Audit
        entry: bash -c 'cd api && composer audit'
        language: system
        pass_filenames: false
        stages: [pre-push]

  # 3. REACT / NODE / JS
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.56.0
    hooks:
      - id: eslint
        name: ESLint React
        files: ^frontend/
        additional_dependencies:
          - eslint@8.56.0
          - eslint-plugin-react@7.33.2
          - eslint-plugin-react-hooks@4.6.0

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        name: Prettier Format
        files: ^frontend/
        args: [--write]

  # 4. GÉNÉRAL - FICHIERS
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixers
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files
    args: ["--maxkb=1000"] # Bloque les fichiers > 1MB
